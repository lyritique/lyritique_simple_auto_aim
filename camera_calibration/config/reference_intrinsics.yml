%YAML:1.0
---
# ============================================================================
# 对照基准：来自 kalman_filter_fixed/material/说明.txt，即视觉第三周作业
# 「提供材料：相机内参」。kalman_filter_fixed/include/data_interaction.hpp
# 里的 pnpConfig::camParams 就是这几个数，pnpSolver 构造函数用它拼 camera_matrix_。
#
# 这个文件只用来做「对照 / 自检真值」，不参与标定计算本身。
# 换相机时把这里改成你自己的出厂标定值即可；不改也不影响标定程序出结果。
# ============================================================================
camera_matrix: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 2362.2795952460974, 0., 679.17513921636282,
           0., 2336.1916035376717, 529.06858905837635,
           0., 0., 1. ]
distortion_coefficients: !!opencv-matrix
   rows: 1
   cols: 5
   dt: d
   data: [ -0.098561592108101559, 0.11173066531932681,
           -0.0038352945867108721, -0.0020421443354436304, 0. ]
image_width: 1440
image_height: 1080
reference_rms: 0.1448
